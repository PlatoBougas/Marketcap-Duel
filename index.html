<div style="margin-top:16px;padding:8px 0;font-size:11px;color:#888;font-style:italic;text-align:center;border-top:1px solid #e0e0e0">Made by Plato Bougas all rights reserved 2026. </div>

<script>

/* ==============================
   DATA
============================== */
const companies = [
  { name: 'NVIDIA', cap: 5.23 },
  { name: 'Alphabet', cap: 4.63 },
  { name: 'Apple', cap: 4.59 },
  { name: 'Microsoft', cap: 3.18 },
  { name: 'Amazon', cap: 2.87 },
  { name: 'TSMC', cap: 2.20 },
  { name: 'Broadcom', cap: 2.03 },
  { name: 'Meta', cap: 1.70 },
  { name: 'Tesla', cap: 1.40 },
  { name: 'Eli Lilly', cap: 1.10 },
  { name: 'Berkshire Hathaway', cap: 1.00 },
  { name: 'Walmart', cap: 1.00 },
  { name: 'JPMorgan Chase', cap: 0.80 },
  { name: 'Visa', cap: 0.62 }
];

const tickerData = [
  ['NVDA','+3.2%',true],['GOOGL','+1.8%',true],['AAPL','-0.4%',false],
  ['MSFT','+0.9%',true],['AMZN','+2.1%',true],['TSM','+1.5%',true],
  ['AVGO','+4.1%',true],['META','+2.7%',true],['TSLA','-1.9%',false],
  ['LLY','+0.6%',true],['BRK','-0.2%',false],['WMT','+1.1%',true],
  ['JPM','+0.8%',true],['V','+0.5%',true]
];

/* ==============================
   TITLE CANVAS — stock chart animation
============================== */
(function initTitleCanvas() {
  const canvas = document.getElementById('titleCanvas');
  const ctx = canvas.getContext('2d');
  const W = 350, H = 550;
  canvas.width = W; canvas.height = H;

  // generate a handful of sine-wave "chart lines" with varying params
  const lines = Array.from({ length: 14 }, (_, i) => ({
    baseY: 80 + (i / 13) * (H - 160),
    amp: 12 + Math.random() * 22,
    freq: 0.01 + Math.random() * 0.015,
    phase: Math.random() * Math.PI * 2,
    speed: 0.006 + Math.random() * 0.005,
    isGreen: Math.random() > 0.45,
    alpha: 0.05 + Math.random() * 0.08
  }));

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    lines.forEach(l => {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const y = l.baseY + Math.sin(x * l.freq + t * l.speed + l.phase) * l.amp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = l.isGreen
        ? `rgba(76,175,80,${l.alpha})`
        : `rgba(244,67,54,${l.alpha * 0.7})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    });
    t++;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ==============================
   TICKER INSIDE TITLE CARD
============================== */
(function buildCardTicker() {
  const track = document.getElementById('cardTickerTrack');
  let html = '';
  for (let pass = 0; pass < 2; pass++) {
    tickerData.forEach(([sym, chg, up]) => {
      html += `<span class="card-ticker-item">
        <span class="t-sym">${sym}</span>
        <span class="${up ? 't-up' : 't-dn'}">${chg}</span>
      </span>`;
    });
  }
  track.innerHTML = html;
})();

/* ==============================
   GAME STATE
============================== */
let score = 0;
let highScore = parseInt(localStorage.getItem('mcap_duel_v8_best') || '0');
let currentPair = [];
let lastScore = 0;

function getNewPair() {
  let i = Math.floor(Math.random() * companies.length);
  let j = Math.floor(Math.random() * companies.length);
  while (j === i) j = Math.floor(Math.random() * companies.length);
  return [companies[i], companies[j]];
}

/* ==============================
   GAME CARD (identical to original)
============================== */
function createCard() {
  const pair = getNewPair();
  currentPair = pair;

  const card = document.createElement('div');
  card.className = 'card';
  card.style.cursor = 'grab';
  card.style.touchAction = 'none';
  card.style.userSelect = 'none';
  card.style.zIndex = '2';

  card.innerHTML = `
    <div class='card-header'>
      <div class='game-title'>Market Cap Duel</div>
      <div class='score-row'><span>Score: ${score}</span><span>Best: ${highScore}</span></div>
    </div>
    <div class='swipe-label bigger'>BIGGER</div>
    <div class='swipe-label smaller'>SMALLER</div>
    <div class='card-half top-half'><div class='company-name'>${pair[0].name}</div></div>
    <div class='vs-container'>
      <div class='hand-hint'></div>
      <div class='vs-badge'>VS</div>
      <div class='vs-instruction'>Swipe Right if Top is BIGGER</div>
    </div>
    <div class='card-half'><div class='company-name'>${pair[1].name}</div></div>
  `;

  setupSwipe(card);
  document.getElementById('cardStack').appendChild(card);
}

function setupSwipe(el) {
  let startX = 0;
  let isDragging = false;
  const bigger = el.querySelector('.bigger');
  const smaller = el.querySelector('.smaller');

  const handleStart = (e) => {
    isDragging = true;
    startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
    el.style.transition = 'none';
  };

  const handleMove = (e) => {
    if (!isDragging) return;
    const x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
    const walk = x - startX;
    el.style.transform = `translateX(${walk}px) rotate(${walk / 15}deg)`;
    bigger.style.opacity = Math.min(walk / 100, 1);
    smaller.style.opacity = Math.min(-walk / 100, 1);
  };

  const handleEnd = (e) => {
    if (!isDragging) return;
    isDragging = false;
    const x = e.type.includes('mouse') ? e.pageX : (e.changedTouches ? e.changedTouches[0].pageX : startX);
    const walk = x - startX;

    if (Math.abs(walk) > 120) {
      const isRight = walk > 0;
      const isCorrect = isRight
        ? currentPair[0].cap >= currentPair[1].cap
        : currentPair[0].cap < currentPair[1].cap;

      if (isCorrect) {
        score++;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('mcap_duel_v8_best', highScore);
        }
        el.classList.add('correct');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, zIndex: 9999 });
        setTimeout(() => { el.remove(); createCard(); }, 500);
      } else {
        // wrong — go to leaderboard
        lastScore = score;
        score = 0;
        el.classList.add('wrong');
        setTimeout(() => {
          el.remove();
          showLeaderboard();
        }, 600);
      }
    } else {
      el.style.transition = 'transform 0.3s ease';
      el.style.transform = '';
      bigger.style.opacity = 0;
      smaller.style.opacity = 0;
    }
  };

  el.addEventListener('mousedown', handleStart);
  el.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);
  el.addEventListener('touchstart', handleStart);
  el.addEventListener('touchmove', handleMove);
  el.addEventListener('touchend', handleEnd);
}

/* ==============================
   SCREEN SWITCHING
============================== */
function showScreen(id) {
  const el = document.getElementById(id);
  el.style.display = 'flex';
  el.classList.remove('fade-in');
  void el.offsetWidth; // reflow
  el.classList.add('fade-in');
}

function hideScreen(id, cb) {
  const el = document.getElementById(id);
  el.classList.add('fade-out');
  el.addEventListener('animationend', () => {
    el.style.display = 'none';
    el.classList.remove('fade-out');
    if (cb) cb();
  }, { once: true });
}

/* ==============================
   LEADERBOARD
============================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNp3soyJt0XydOuq9TgN0PHfL3YORXK0jUQAhSM6U9UIopOcYfruP8qev8jzRh3rcHYQ/exec';

async function fetchScores() {
  const r = await fetch(APPS_SCRIPT_URL);
  const data = await r.json();
  return Array.isArray(data) ? data : [];
}

async function saveScore(name, s) {
  await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ name: name.trim().slice(0, 18) || 'Anonymous', score: s }),
  });
  await new Promise(r => setTimeout(r, 1500));
  return await fetchScores();
}
function renderScores(scores, highlightName) {
  const list = document.getElementById('lbList');
  if (!scores.length) {
    list.innerHTML = '<div class="lb-loading">No scores yet — be the first!</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  let marked = false;
  list.innerHTML = scores.slice(0, 25).map((s, i) => {
    const isYou = !marked && highlightName && s.name === highlightName && s.score === lastScore;
    if (isYou) marked = true;
    return `<div class="lb-row${isYou ? ' lb-you' : ''}">
      <div class="lb-rank-cell">${medals[i] || (i + 1)}</div>
      <div class="lb-name-cell">${escHtml(s.name)}${isYou ? '<span class="lb-you-tag">you</span>' : ''}</div>
      <div class="lb-score-cell">${s.score}</div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function showLeaderboard() {
  document.getElementById('finalScore').textContent = lastScore;
  document.getElementById('yourRankNum').textContent = '—';
  document.getElementById('nameInput').value = '';
  document.getElementById('nameEntryRow').style.display = 'flex';
  document.getElementById('postBtn').disabled = false;
  document.getElementById('postBtn').textContent = 'Post';
  document.getElementById('lbList').innerHTML = '<div class="lb-loading">Loading scores…</div>';

  showScreen('lbCard');

  const scores = await fetchScores();
  renderScores(scores, null);
}

document.getElementById('postBtn').addEventListener('click', async () => {
  const btn = document.getElementById('postBtn');
  const name = document.getElementById('nameInput').value.trim() || 'Anonymous';
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const scores = await saveScore(name, lastScore);
    const rank = scores.findIndex(s => s.name === name && s.score === lastScore) + 1;
    document.getElementById('yourRankNum').textContent = `#${rank}`;
    document.getElementById('nameEntryRow').style.display = 'none';
    renderScores(scores, name);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Post';
  }
});

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('postBtn').click();
});

document.getElementById('playAgainBtn').addEventListener('click', () => {
  hideScreen('lbCard', () => {
    score = 0;
    createCard();
  });
});

/* ==============================
   START BUTTON
============================== */
document.getElementById('startBtn').addEventListener('click', () => {
  hideScreen('titleCard', () => {
    createCard();
  });
});

</script>
